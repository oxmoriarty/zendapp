name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build never queries the database (API routes are server-rendered
      # on demand, not statically executed), so these dummy values just need
      # to be present and syntactically valid — not real credentials.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/zendapp"
      SESSION_SECRET: "ci-placeholder-secret-not-used-in-production"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build